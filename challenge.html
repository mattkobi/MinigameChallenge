<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Demo</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
        }

        #nachricht {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>
    <button onclick="zeigeNachricht()">Drück mich</button>

    <div id="nachricht">
        Robert ist echt zu dumm für alles.
    </div>

    <script>
        function zeigeNachricht() {
            document.getElementById("nachricht").style.display = "block";
        }
    </script>
</body>
</html>
